<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>stables.rip — On-chain stablecoin censorship tracker</title>
    <meta name="description" content="Real-time tracking of frozen stablecoin addresses across Ethereum and TRON. USDT and USDC freeze intel, wallet checker, and censorship analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var mode = localStorage.getItem('theme-mode') || 'system';
        var skin = localStorage.getItem('theme-skin') || 'terminal';
        var contrast = localStorage.getItem('contrast');
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var cls = resolved + ' skin-' + skin;
        if (contrast === 'high') cls += ' high-contrast';
        document.documentElement.className = cls;
        var zoom = localStorage.getItem('PREF_FONT_SIZE');
        if (zoom === 'large') document.documentElement.style.zoom = '1.15';
        else if (zoom === 'xl') document.documentElement.style.zoom = '1.3';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
